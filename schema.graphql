  reason: String
}

enum ServiceCategory {
  """An extra billed alongside a MAIN item: swimming, extra playtime."""
  ADDON

  """A primary service: a stay, a day of daycare, a grooming session."""
  MAIN
}

type ServicePriceException {
  active: Boolean!

  """When true, package balances may not be spent on these dates."""
  blockPackageUse: Boolean!
  daysMask: Int!
  description: String
  endDate: DateTime!
  id: ID!

  """
  When true, startDate and endDate bound the SEASON within which daysMask
  repeats — so "weekend surcharge, all of 2026" is one row, not 104.
  """
  isRecurring: Boolean!
  name: String!

  """Highest wins when two exceptions overlap. Ties break on most recent."""
  priority: Int!

  """Short machine-readable motive: HIGH_SEASON, HOLIDAY, WEEKEND."""
  reason: String

  """When true, no discount line may be applied on these dates."""
  requireFullPrice: Boolean!
  service: Service!
  specialPrice: Money!
  startDate: DateTime!
}

enum ServiceStatus {
  ACTIVE
  ARCHIVED
  INACTIVE
}

enum ServiceType {
  DAYCARE
  GROOMING
  HOTEL
  TRAINING
}

input SignInUserInput {
  email: String!
  password: String!
}

input UpdateCompanyInput {
  address: AddressInput
  email: String
  logoUrl: String
  name: String
  phone: String
  timezone: String
}

input UpdateDogInput {
  birthDate: DateTime
  breed: String
  color: String
  gender: Gender
  name: String
  notes: String
  size: DogSize
  weightKg: String
}

input UpdatePriceExceptionInput {
  active: Boolean
  blockPackageUse: Boolean
  daysMask: Int
  description: String
  endDate: DateTime
  isRecurring: Boolean
  name: String
  priority: Int
  reason: String
  requireFullPrice: Boolean
  specialPrice: Money
  startDate: DateTime
}

input UpdateServiceInput {
  capacity: Int
  checkoutCutoffMinute: Int
  closesAtMinute: Int
  daysMask: Int
  description: String
  durationMinutes: Int
  lateCheckoutServiceId: ID
  name: String
  opensAtMinute: Int
  price: Money
  pricingUnit: PricingUnit
  status: ServiceStatus
}

"""
Self-service profile edits only.

`companyId` and `clientOfId` used to be accepted here, which let any user
attach themselves to any company — privilege escalation in one mutation.
Membership changes now go through inviteMember / revokeMembership, which are
role-gated. `password` is not here either: changing it requires the current
password, so it has its own mutation.
"""
input UpdateUserInput {
  birthDate: DateTime
  gender: Gender
  lastname: String
  name: String
  phone: String
}

"""File upload, used by the dog image mutations."""
scalar Upload

type User {
  birthDate: DateTime
  createdAt: DateTime!

  """Dogs this user owns."""
  dogs: [Dog!]!
  email: String!
  emailVerifiedAt: DateTime
  gender: Gender
  id: ID!
  lastname: String

  """Memberships visible to the caller, scoped to their company."""
  memberships: [CompanyMembership!]!
  name: String
  phone: String
  profilePicture: String
  status: UserStatus!
}

"""Lifecycle of a user account, independent of any company membership."""
enum UserStatus {
  ACTIVE
  BLOCKED
  DELETED
  INACTIVE

  """Registered but email not yet verified."""
  INCOMPLETE
}
